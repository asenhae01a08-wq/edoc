<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>eDOC - Importar Turma</title>


<link rel="stylesheet"
href="{{ url_for('static', filename='style5.css') }}?v=31">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

.topo-importacao{

    display:flex;
    align-items:center;
    gap:18px;

    padding-bottom:20px;
    margin-bottom:25px;

    border-bottom:1px solid #d8e0e6;
}


.titulo-importacao h1{

    margin:0 0 5px;

    color:#172b3a;

    font-size:26px;

}


.titulo-importacao p{

    margin:0;

    color:#667580;

}


.area-importacao{

    display:flex;

    flex-direction:column;

    gap:20px;

}


.caixa-upload{

    padding:35px;

    border:1px dashed #9bbcd2;

    border-radius:12px;

    background:#f8fbfd;

    text-align:center;

}


.caixa-upload i{

    font-size:45px;

    color:#0c4770;

    margin-bottom:15px;

}


.caixa-upload input{

    margin-top:15px;

}



.botao-importar{

    width:100%;

    height:45px;

    border:none;

    border-radius:10px;

    background:#0c4770;

    color:white;

    font-size:16px;

    cursor:pointer;

}


.botao-importar:hover{

    background:#073450;

}


.modelo{

    margin-top:25px;

    padding:20px;

    background:#e9f3fa;

    border-radius:10px;

}


.modelo h3{

    color:#0c4770;

    margin-bottom:10px;

}


.modelo span{

    display:inline-block;

    background:white;

    padding:8px 12px;

    margin:5px;

    border-radius:8px;

}


</style>

</head>



<body>


{% include 'cabecalho_profissional.html' %}



<main class="pagina-cadastro">


<section class="card-cadastro">



<div class="topo-importacao">


<a href="{{ url_for('inicialp') }}"
class="edoc-voltar-pagina">

<i class="fa-solid fa-arrow-left"></i>

</a>



<div class="titulo-importacao">

<h1>
Importar turma
</h1>


<p>
Envie uma planilha para cadastrar alunos automaticamente.
</p>


</div>


</div>




<form method="POST"
enctype="multipart/form-data"
class="area-importacao">



<div class="caixa-upload">


<i class="fa-solid fa-file-excel"></i>


<h2>
Selecionar planilha
</h2>


<p>
Formato aceito: .xlsx
</p>


<input 
type="file"
name="arquivo"
accept=".xlsx,.xls"
required>


</div>




<button class="botao-importar"
type="submit">

<i class="fa-solid fa-upload"></i>

Importar alunos

</button>



</form>




<div class="modelo">

<h3>
Modelo da planilha:
</h3>


<span>Nome</span>

<span>Matrícula</span>

<span>CPF</span>

<span>Email</span>

<span>Turma</span>

<span>Curso</span>


</div>



</section>


</main>


</body>

</html>
