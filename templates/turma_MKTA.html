<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>eDOC - Turma 3º MKT A</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style11.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
</head>

<body>

    <main class="pagina">

        <section class="painel">

            <!-- VOLTAR -->
            <button
                type="button"
                class="botao-voltar"
                onclick="history.back()"
            >
                <i class="fa-solid fa-arrow-left"></i>
            </button>


            <!-- IDENTIDADE -->
            <div class="identidade">

                <div class="icone-logo">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>

                <h2>eDOC</h2>

            </div>


            <!-- TÍTULO -->
            <div class="cabecalho">

                <h1>Turma 3º MKT A</h1>

                <p>
                    <span id="quantidadeAlunos">
                        {{ alunos|length }}
                    </span>
                    alunos · Consulta de Documentos
                </p>

            </div>


            <!-- PESQUISA -->
            <div class="pesquisa">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="pesquisaAluno"
                    placeholder="Buscar por nome ou matrícula..."
                    autocomplete="off"
                >

            </div>


            <!-- LISTA -->
            <div class="lista-alunos" id="listaAlunos">

                {% for aluno in alunos %}

                <div
                    class="aluno-card"
                    data-nome="{{ aluno['nome']|lower }}"
                    data-matricula="{{ aluno['matricula'] }}"
                >

                    <div class="informacoes-aluno">

                        <div class="avatar">
                            {{ aluno["nome"][0].upper() }}
                        </div>

                        <div class="dados">

                            <strong>
                                {{ aluno["nome"] }}
                            </strong>

                            <span>
                                Matrícula: {{ aluno["matricula"] }}
                            </span>

                        </div>

                    </div>


                    <a
                        href="{{ url_for('ficha19', aluno_id=aluno['id']) }}"
                        class="botao-gerar"
                    >

                        <i class="fa-regular fa-file-lines"></i>

                        Gerar Ficha

                    </a>

                </div>

                {% else %}

                <div class="sem-alunos">
                    <i class="fa-regular fa-folder-open"></i>

                    <p>
                        Nenhum aluno encontrado nesta turma.
                    </p>
                </div>

                {% endfor %}

            </div>


            <!-- RESULTADO DA BUSCA -->
            <div
                class="nenhum-resultado"
                id="nenhumResultado"
            >
                <i class="fa-solid fa-magnifying-glass"></i>

                <p>
                    Nenhum aluno encontrado.
                </p>
            </div>

        </section>

    </main>


    <script>

        const pesquisa =
            document.getElementById("pesquisaAluno");

        const alunos =
            document.querySelectorAll(".aluno-card");

        const nenhumResultado =
            document.getElementById("nenhumResultado");


        pesquisa.addEventListener("input", function () {

            const valor =
                this.value
                    .toLowerCase()
                    .trim();

            let encontrados = 0;


            alunos.forEach(function (aluno) {

                const nome =
                    aluno.dataset.nome;

                const matricula =
                    aluno.dataset.matricula;

                const corresponde =
                    nome.includes(valor) ||
                    matricula.includes(valor);


                if (corresponde) {

                    aluno.style.display = "flex";
                    encontrados++;

                } else {

                    aluno.style.display = "none";

                }

            });


            if (
                encontrados === 0 &&
                alunos.length > 0
            ) {

                nenhumResultado.style.display = "flex";

            } else {

                nenhumResultado.style.display = "none";

            }

        });

    </script>

</body>

</html>
