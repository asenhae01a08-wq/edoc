<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>eDOC - Recuperar Senha</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style13.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="container">

        <section class="card">
            <a
    href="{{ url_for('login') }}"
    class="botao-voltar"
    title="Voltar"
>
    <i class="fa-solid fa-arrow-left"></i>
</a>

            <div class="logo">
                <i class="fa-solid fa-key"></i>
            </div>

            <h1>Recuperar senha</h1>

            <p class="subtitulo">
                Digite o seu e-mail cadastrado.
                Enviaremos as instruções para redefinir sua senha.
            </p>

            {% with mensagens = get_flashed_messages() %}
                {% if mensagens %}
                    {% for mensagem in mensagens %}
                        <div class="mensagem">
                            {{ mensagem }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('esqueci') }}">

                <div class="grupo">

                    <label for="email">
                        E-mail
                    </label>

                    <div class="campo">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>
                

                <button type="submit" class="btn">

                    <i class="fa-solid fa-paper-plane"></i>

                    Enviar instruções

                </button>

            </form>


        </section>

    </main>

</body>
</html>
