<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>eDOC - Recuperar Senha</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style13.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <style>

        /* ==========================================
           AJUSTE DO BOTÃO VOLTAR
        ========================================== */

        .card {
            position: relative;
        }

        .voltar-topo {
            position: absolute;

            top: 18px;
            left: 18px;

            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e9f3fa;
            color: #0c4770;

            border: 1px solid #c9ddea;
            border-radius: 10px;

            text-decoration: none;

            transition: 0.2s ease;

            z-index: 10;
        }

        .voltar-topo:hover {
            background: #0c4770;
            color: #ffffff;

            transform: translateX(-3px);
        }

        .voltar-topo i {
            font-size: 16px;
        }


        /* Dá um pouco mais de espaço
           para o conteúdo não bater no botão */

        .logo {
            margin-top: 10px;
        }


        /* MENSAGENS */

        .mensagem-edoc {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 18px;

            font-size: 13px;
            line-height: 1.5;
        }

        .mensagem-sucesso {
            background: #edf8f4;
            border: 1px solid #bfe1d5;
            color: #1d7259;
        }

        .mensagem-erro {
            background: #fff0f0;
            border: 1px solid #f1caca;
            color: #a83838;
        }

    </style>

</head>


<body>


    <main class="container">


        <section class="card">


            <!-- ==========================================
                 VOLTAR
            ========================================== -->

            <a
                href="{{ url_for('login') }}"
                class="voltar-topo"
                title="Voltar para o login"
                aria-label="Voltar para o login"
            >

                <i class="fa-solid fa-arrow-left"></i>

            </a>



            <!-- ==========================================
                 ÍCONE
            ========================================== -->

            <div class="logo">

                <i class="fa-solid fa-key"></i>

            </div>



            <h1>
                Recuperar senha
            </h1>


            <p class="subtitulo">

                Digite o seu e-mail cadastrado.
                Enviaremos as instruções para redefinir sua senha.

            </p>



            <!-- ==========================================
                 MENSAGENS
            ========================================== -->

            {% with mensagens = get_flashed_messages(with_categories=true) %}

                {% if mensagens %}

                    {% for categoria, mensagem in mensagens %}

                        <div
                            class="
                                mensagem-edoc

                                {% if categoria == 'sucesso' %}
                                    mensagem-sucesso
                                {% else %}
                                    mensagem-erro
                                {% endif %}
                            "
                        >

                            {{ mensagem }}

                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}



            <!-- ==========================================
                 FORMULÁRIO
            ========================================== -->

            <form
                method="POST"
                action="{{ url_for('esqueci') }}"
            >


                <div class="grupo">


                    <label for="email">

                        E-mail

                    </label>


                    <div class="campo">


                        <i class="fa-regular fa-envelope"></i>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >


                    </div>


                </div>



                <button
                    type="submit"
                    class="btn"
                >

                    <i class="fa-solid fa-paper-plane"></i>

                    Enviar instruções

                </button>


            </form>


        </section>


    </main>


</body>

</html>
