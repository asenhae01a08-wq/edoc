<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Ficha 19 - eDOC
    </title>


    <!-- ==========================================
         CSS DA FICHA 19
    ========================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/ficha19.css') }}"
    >


    <!-- ==========================================
         FONT AWESOME
    ========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ==========================================
         AJUSTES DO CABEÇALHO / IMPRESSÃO
    ========================================== -->

    <style>

        body {
            margin: 0;
        }


        /* Cabeçalho sempre ocupando toda a largura */

        #edoc-cabecalho-profissional {
            width: 100%;
        }


        /* Não imprimir cabeçalhos e botões do sistema */

        @media print {

            #edoc-cabecalho-profissional,
            .topo {
                display: none !important;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         CABEÇALHO PADRÃO DO PROFISSIONAL
    ========================================== -->

    {% include 'cabecalho_profissional.html' %}



    <!-- ==========================================
         VISUALIZADOR DA FICHA 19
    ========================================== -->

    <div class="viewer">



        <!-- ======================================
             BARRA DE AÇÕES DA FICHA
        ====================================== -->

        <div class="topo">


            <!-- VOLTAR -->

            <a
                href="{{ url_for('turma_3tdsa') }}"
                class="btn-voltar"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Voltar

            </a>



            <!-- TÍTULO -->

            <h2>

                Ficha 19

            </h2>



            <!-- AÇÕES -->

            <div class="acoes">


                <!-- IMPRIMIR -->

                <button
                    type="button"
                    onclick="window.print()"
                    class="btn"
                >

                    <i class="fa-solid fa-print"></i>

                    Imprimir

                </button>



                <!-- GERAR PDF -->

                <button
                    type="button"
                    class="btn"
                >

                    <i class="fa-regular fa-file-pdf"></i>

                    Gerar PDF

                </button>


            </div>


        </div>



        <!-- ======================================
             DOCUMENTO
        ====================================== -->

        <div class="documento">



            <!-- ==============================
                 PÁGINA 1
            ============================== -->

            {% include 'capa.html' %}



            <!-- ==============================
                 PÁGINA 2
            ============================== -->

            {% include 'formacao_geral.html' %}



            <!-- ==============================
                 PÁGINA 3
            ============================== -->

            {% include 'tecnica1.html' %}



            <!-- ==============================
                 PÁGINA 4
            ============================== -->

            {% include 'tecnica2.html' %}



            <!-- ==============================
                 PÁGINA 5
            ============================== -->

            {% include 'tecnica3.html' %}


        </div>


    </div>


</body>

</html>
