

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eDOC - Acesso do Aluno</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style2.css') }}">

  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <div class="container">

    <div class="logo">
      <div class="logo-circle">
        <i class="fa-regular fa-file-lines"></i>
      </div>
      <h2>eDOC</h2>
    </div>

    <div class="user-icon">
      <i class="fa-regular fa-user"></i>
    </div>

    <h1>ACESSO</h1>

    <form action="{{ url_for('login') }}" method="POST" id="loginForm">

      <div class="input-box">
        <i class="fa-regular fa-user"></i>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Digite seu e-mail"
          required>
      </div>

      <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input
          type="password"
          name="senha"
          id="senha"
          placeholder="Digite sua senha"
          required>

        <i class="fa-regular fa-eye" id="toggleSenha"></i>
      </div>

      <button type="submit">ENTRAR</button>

      <div class="forgot">
        <a href="{{ url_for('esqueci') }}">Esqueci minha senha</a>
      </div>

    </form>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

  </div>

  <script src="{{ url_for('static', filename='script/script2.js') }}"></script>

</body>

</html>
